<!--SUBJECT: Your limousine booking has been assigned — {{BookingReference}}-->
<h2 style="margin-top:0;color:#1a1a2e;">Driver Assigned</h2>
<p>Dear {{CustomerName}},</p>
<p>A driver has been assigned to your booking.</p>
<table role="presentation" cellpadding="4" cellspacing="0" style="width:100%;font-size:14px;">
<tr><td style="color:#666666;">Booking reference</td><td><strong>{{BookingReference}}</strong></td></tr>
<tr><td style="color:#666666;">Trip</td><td>{{Departure}} &rarr; {{Destination}}</td></tr>
<tr><td style="color:#666666;">Date</td><td>{{BookingDate}}</td></tr>
<tr><td style="color:#666666;">Pickup time</td><td>{{PickupTime}}</td></tr>
<tr><td style="color:#666666;">Pickup address</td><td>{{PickupAddress}}</td></tr>
<tr><td style="color:#666666;">Status</td><td>{{Status}}</td></tr>
</table>
<p>We look forward to driving you.</p>
