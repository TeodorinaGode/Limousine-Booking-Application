<!--SUBJECT: New limousine assignment — {{BookingReference}}-->
<h2 style="margin-top:0;color:#1a1a2e;">New Assignment</h2>
<p>You have been assigned booking {{BookingReference}}.</p>
<table role="presentation" cellpadding="4" cellspacing="0" style="width:100%;font-size:14px;">
<tr><td style="color:#666666;">Customer</td><td>{{CustomerName}}</td></tr>
<tr><td style="color:#666666;">Customer phone</td><td>{{CustomerPhone}}</td></tr>
<tr><td style="color:#666666;">Trip</td><td>{{Departure}} &rarr; {{Destination}}</td></tr>
<tr><td style="color:#666666;">Date</td><td>{{BookingDate}}</td></tr>
<tr><td style="color:#666666;">Pickup time</td><td>{{PickupTime}}</td></tr>
<tr><td style="color:#666666;">Pickup address</td><td>{{PickupAddress}}</td></tr>
<tr><td style="color:#666666;">Passengers</td><td>{{PassengerCount}}</td></tr>
<tr><td style="color:#666666;">Notes</td><td>{{Notes}}</td></tr>
</table>
