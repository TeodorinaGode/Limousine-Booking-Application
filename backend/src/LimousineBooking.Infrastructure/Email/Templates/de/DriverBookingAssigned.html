<!--SUBJECT: Neue Limousinenzuweisung — {{BookingReference}}-->
<h2 style="margin-top:0;color:#1a1a2e;">Neue Zuweisung</h2>
<p>Ihnen wurde die Buchung {{BookingReference}} zugewiesen.</p>
<table role="presentation" cellpadding="4" cellspacing="0" style="width:100%;font-size:14px;">
<tr><td style="color:#666666;">Kunde</td><td>{{CustomerName}}</td></tr>
<tr><td style="color:#666666;">Telefonnummer des Kunden</td><td>{{CustomerPhone}}</td></tr>
<tr><td style="color:#666666;">Fahrt</td><td>{{Departure}} &rarr; {{Destination}}</td></tr>
<tr><td style="color:#666666;">Datum</td><td>{{BookingDate}}</td></tr>
<tr><td style="color:#666666;">Abholzeit</td><td>{{PickupTime}}</td></tr>
<tr><td style="color:#666666;">Abholadresse</td><td>{{PickupAddress}}</td></tr>
<tr><td style="color:#666666;">Passagiere</td><td>{{PassengerCount}}</td></tr>
<tr><td style="color:#666666;">Notizen</td><td>{{Notes}}</td></tr>
</table>
