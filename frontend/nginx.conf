server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a client-side-routed SPA (react-router) — a direct request for,
    # say, /admin/bookings has no matching file on disk, so fall back to
    # index.html and let the app's own router handle it. Without this, every
    # route except "/" 404s on a hard refresh or a shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints build output filenames with a content hash, so a
    # cached asset is either exactly right or no longer referenced by
    # anything — safe to cache aggressively. index.html itself is NOT matched
    # by this (it's a bare filename, not under an extension-matched path) and
    # keeps nginx's normal default (no long-lived caching), since it's what
    # has to be re-fetched to discover a new deploy at all.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
